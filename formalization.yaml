# DRAFT — framing and provenance pending author sign-off.
version: v0.4

project:
  name: "Sequential products on Hermitian matrix algebras, with Albert's power-associativity theorem and real Wigner rigidity"
  authors:
    - "Bryan Ehrlich"
  responsible_maintainers:
    - "Bryan Ehrlich"
  license: "Apache-2.0"
  description: >-
    A sequential product on the effects of an order-unit space is a binary operation
    a & b, read "first test a, then test b with the state updated by the first test",
    satisfying the seven axioms S1-S7 of van de Wetering (arXiv:1803.11139,
    Definition 2). This development registers two classification theorems for such
    products on the Hermitian matrix algebras.

    On H_N(R), the Hermitian N x N real matrices with N >= 1, every sequential product is
    the Lueders product sqrt(a) b sqrt(a): there is no free parameter. On H_N(C) with
    N >= 3, every sequential product has the twist normal form a^(1/2+it) b a^(1/2-it) for
    a unique real t. The complex result is the substantial one: the twist family is a
    genuine one-parameter deformation of the Lueders product, and the theorem says nothing
    outside it satisfies the axioms. The equations are asserted on all effects, including
    singular ones, and the uniqueness of t is part of the registered statement.

    DIRECTION. Both registered classification theorems are necessity: a product satisfying the
    axioms is supplied, and the theorem says it has the stated normal form. The two converses
    differ in status and neither is registered. For the complex row, that each real t defines a
    SeqProd satisfying S2 is proved in the wider development; together with the registered
    uniqueness it is what would make the parameter map injective. For the real row, that the
    Lueders formula defines a SeqProd satisfying S2 is NOT proved anywhere in this development.
    Nothing here registers a bijection between parameters and products, or the admissibility of
    the Lueders formula.

    The package also registers two classical theorems the development proves in passing.
    Albert's power-associativity theorem: in a commutative Jordan ring carrying an R-module
    structure, x^(m+1) * x^(n+1) = x^(m+n+2), with no unit, finite dimension, formal reality
    or positivity assumed. And the real case of Wigner's theorem: every transition
    probability preserving self-map of the rays of a finite-dimensional real inner product
    space is induced by a linear isometry, with bijectivity not assumed but derived.

    Both CLASSIFICATION theorems are proved from S1-S7 with no hypotheses beyond the dimension
    bounds, and their axiom closures contain only Lean's three core axioms (propext,
    Classical.choice, Quot.sound). The continuity axiom S2 is stated in the order-unit
    norm, as an explicit epsilon-delta condition, so the statement file depends on no
    normed-space or topological instance; the equivalence with continuity in the
    carrier's Frobenius topology is proved in the development.

    SCOPE. Comparator registers FOUR theorems across THREE separate entries: the two
    sequential-product classifications above, which use the SeqProd interface and the axiom
    S2 and correspond to numbered rows of the manuscript; and the two ancillary classical
    theorems, Albert and Wigner, which use neither and correspond to no manuscript row.
    Nothing beyond those four registered theorems is claimed by this submission.

    The two classification theorems are two rows of a thirty-six row manifest tracking the
    numbered results of the accompanying manuscript. The manuscript as a whole is NOT
    formalized: as of 2026-08-12 the manifest stands at 12 rows formalized, 19 partial,
    and 5 absent. In particular the quaternionic row H_n(H) and the Albert-algebra row
    H_3(O) of the manuscript's main theorem are not proved here, the converse of the
    complex residue is not proved, and the coalescence and diagonal-homomorphism lemmas
    are established on the concrete carrier H_N(C) rather than at the manuscript's
    stated generality of a finite-dimensional simple Euclidean Jordan algebra. Nothing
    outside the four registered theorems is claimed by this submission.

classification:
  arxiv: [math.OA, math.RA, quant-ph]
  msc2020: [17C65, 81P16, 46L70, 81P10, 15B57, 17C90]

automation:
  methods:
    - method: agent
      tool_setup: >-
        AI-assisted throughout. The Lean development was produced over a series of
        working arcs using Anthropic's Claude models in an agentic coding harness
        (Claude Code), with the author directing the mathematics, setting the
        statements, and reviewing and accepting every result. Proof search,
        refactoring, and the bulk of tactic writing were model-generated; the choice
        of what to prove, the statement-fidelity boundary, and all status judgements
        are the author's.
    - method: manual
      tool_setup: >-
        Portions were written or repaired by hand by the author, and the manuscript
        the development follows is the author's own prior work.

review:
  status: agent-reviewed
  reviewers:
    - "Bryan Ehrlich (author review, all arcs)"
    - "Isolated cold-review sub-agents (Anthropic Claude), one or more rounds per arc"
  notes: >-
    The development carries its own mechanical audit, AxiomAudit.lean, which on
    elaboration enforces over every declaration in the tracked tree: an axiom closure
    contained in Lean's three core axioms, absence of any custom axiom declaration,
    absence of sorryAx and native_decide, a pinned module manifest, exact-closure
    sentinels on the principal results, and type and body freezes on the statement
    boundary. Non-formalized rows are itemized in STATEMENT-MANIFEST.md. Many in-scope
    gaps carry a dated, compiling wall certificate in WallCertificates/ stating the missing
    step in Lean with a sorry at the gap; those files sit at the repository root and are
    never imported by the library. That coverage is deliberately not total and the
    directory's own README says so: the six pre-registered external rows are documented
    there but are explicitly NOT certificates, several certificate files now carry zero
    live gaps because their gap was later discharged and are kept for the retraction
    record, and at least one row is deliberately not written as a sorry because
    transcribing its statement without the manuscript open is how two defective gap
    statements were previously produced. The campaign record, including retractions and self-corrections, is in
    LEDGER.md; the frozen row list is STATEMENT-MANIFEST.md. Review was iterative and
    adversarial rather than external and independent: no third party has refereed this
    development, and the accompanying manuscript has not been peer reviewed.

sources:
  - title: >-
      Sequential Products on Euclidean Jordan Algebras: Classification in Rank at
      Least Three and the Complex Qubit
    type: paper
    authors:
      - "Bryan Ehrlich"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      The author's own manuscript, which these two theorems formalize. It is
      unpublished and has not been refereed: it was submitted to J. Phys. A in August
      2026 and returned as an immediate editorial reject with no referee reports, so it
      carries no external correctness signal. No stable public identifier exists at the
      time of submission; the source cannot be independently confirmed and no priority
      or novelty is claimed from it.
  - title: "Sequential product spaces are Jordan algebras"
    type: paper
    authors:
      - "John van de Wetering"
    identifier: "arXiv:1803.11139"
    relationship: background
    note: >-
      Supplies Definition 2, the axioms S1-S7 that SeqProd states, and the
      sequential-product-to-Jordan-algebra framework the classification sits in.
  - title: "On Jordan algebras of linear transformations"
    type: paper
    authors:
      - "A. A. Albert"
    identifier: "doi:10.1090/S0002-9947-1946-0016759-3"
    relationship: formalizes
    author_endorsement: "n/a"
    note: >-
      Source of the power-associativity theorem registered as
      AlbertPowerAssoc.jpow_mul_jpow. The Lean proof is independent of Albert's argument
      in its details but formalizes the same statement.
  - title: "Wigner's theorem on symmetries of quantum mechanical systems, real case"
    type: folklore
    relationship: formalizes
    author_endorsement: "n/a"
    note: >-
      Source of WignerReal.exists_isometry_of_transProbPreserving. The classical statement
      is due to Wigner; dropping bijectivity gives what the literature calls the
      non-bijective Wigner theorem, which is NOT the Uhlhorn form (Uhlhorn instead weakens the
      hypothesis to preservation of orthogonality and traditionally retains bijectivity). The
      finite-dimensional real case in the exact form registered here is standard but we give
      no single canonical reference for it, and claim no priority. NOVELTY OF THE
      FORMALIZATION IS NOT ESTABLISHED: we are aware of no formalization of the real case
      in Lean or any other proof assistant, and the complex case in this repository is
      vendored from a separate Lean development, but we have not carried out a systematic
      search across proof assistants.
  - title: "Sequential products on effect algebras"
    type: paper
    authors:
      - "Stanley Gudder"
      - "Richard Greechie"
    relationship: background
    note: >-
      Origin of the sequential product notion and of the Lueders product as its
      motivating example on operator effects.

related_formalizations:
  - id: "leanprover-community/physlib"
    relationship: builds-on
    note: >-
      Seventeen modules (Hermitian matrices with the Loewner order, trace inner
      product, continuous functional calculus, Jordan product) by Alex Meiburg, with
      HermitianMat/Proj.lean also by Leonardo A Lessa, vendored verbatim at commit
      ad1d812 under RadicalRelativity/Vendor/ with per-file copyright headers retained.
      They form the carrier substrate the classification is proved over. Backported
      from Mathlib v4.32 to v4.28; the edit log and a zero-statement-change audit are
      in RadicalRelativity/Vendor/VENDOR.md.
  - id: "zblore/csd-lean4"
    relationship: builds-on
    note: >-
      Eight modules by Zayn Blore giving complex Wigner rigidity on CP^(N-1), vendored
      verbatim at commit 2287f45; this is an input to the complex row. The
      corresponding real, non-bijective Wigner theorem is first-party
      (RadicalRelativity/Wigner/RealWigner.lean) and is not derived from this work.
