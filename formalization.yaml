version: v0.4

project:
  name: "Sequential products on Hermitian matrix algebras, with Albert's power-associativity theorem and real Wigner rigidity"
  authors:
    - "Bryan Ehrlich"
  responsible_maintainers:
    - "Bryan Ehrlich"
  license: "Apache-2.0"
  description: >-
    A sequential product on the effects of an order-unit space is a binary operation
    a & b, read "first test a, then test b with the state updated by the first test",
    satisfying the seven axioms S1-S7 of van de Wetering (arXiv:1803.11139,
    Definition 2). This development registers two classification theorems for such
    products on the Hermitian matrix algebras.

    On H_N(R), the Hermitian N x N real matrices with N >= 1, every sequential product is
    the Lueders product sqrt(a) b sqrt(a): there is no free parameter. On H_N(C) with
    N >= 3, every sequential product has the twist normal form a^(1/2+it) b a^(1/2-it) for
    a unique real t. The twist family is a one-parameter deformation of the Lueders product,
    and the complex theorem says nothing outside it satisfies the axioms.

    Prior art. That Lueders is not the only sequential product, and twisted products of this
    shape in particular, are not new: Gudder asked the question in 2005, Shen and Wu answered
    it negatively and gave a general construction in 2009 (arXiv:0905.0596), and Liu, Wu and
    Wu showed those examples are unitary equivalent to Lueders (arXiv:1009.2593). What is
    registered here is the converse direction. The examples are not exhibited; they are shown
    to be forced, with the parameter unique, and with no product outside the family admissible. The equations are asserted on all effects, including
    singular ones, and the uniqueness of t is part of the registered statement.

    Direction. Both registered classification theorems are necessity: a product satisfying the
    axioms is supplied, and the theorem says it has the stated normal form. The two converses
    differ in status and neither is registered. For the complex case, that each real t defines a
    SeqProd satisfying S2 is proved in the wider development; together with the registered
    uniqueness it is what would make the parameter map injective. For the real case, that the
    Lueders formula defines a SeqProd satisfying S2 is not proved anywhere in this development.
    Nothing here registers a bijection between parameters and products, or the admissibility of
    the Lueders formula.

    The package also registers two classical theorems the development proves in passing.
    Albert's power-associativity theorem: in a commutative Jordan ring carrying an R-module
    structure, x^(m+1) * x^(n+1) = x^(m+n+2), with no unit, finite dimension, formal reality
    or positivity assumed. And the real case of Wigner's theorem: every transition
    probability preserving self-map of the rays of a finite-dimensional real inner product
    space is induced by a linear isometry, with bijectivity not assumed but derived.

    Both classification theorems are proved from S1-S7 with no hypotheses beyond the dimension
    bounds, and their axiom closures contain only Lean's three core axioms (propext,
    Classical.choice, Quot.sound). The continuity axiom S2 is stated in the order-unit
    norm, as an explicit epsilon-delta condition, so the statement file depends on no
    normed-space or topological instance; the equivalence with continuity in the
    carrier's Frobenius topology is proved in the development.

    Scope. The repository carries three Comparator configurations, selecting four theorems
    between them: the two sequential-product classifications above, which use the SeqProd
    interface and the axiom S2 and correspond to numbered rows of the manuscript; and the two
    ancillary classical theorems, Albert and Wigner, which use neither and correspond to no
    manuscript row. Each configuration is a separate submission and a separate entry; no one
    entry contains all four. No Palomar claim is made here for any other declaration in the
    repository.

    The two classification theorems are two rows of a thirty-six row manifest tracking the
    numbered results of the accompanying manuscript. The manuscript as a whole is not
    formalized: as of 2026-08-12 the manifest stands at 12 rows formalized, 19 partial,
    and 5 absent. In particular the quaternionic row H_n(H) and the Albert-algebra row
    H_3(O) of the manuscript's main theorem are not proved here, and the coalescence and
    diagonal-homomorphism lemmas are established on the concrete carrier H_N(C) rather than
    at the manuscript's stated generality of a finite-dimensional simple Euclidean Jordan
    algebra.

classification:
  arxiv: [math.OA, math.RA, quant-ph]
  msc2020: [17C65, 81P16, 46L70, 81P10, 15B57, 17C90]

automation:
  methods:
    - method: agent
      tool_setup: >-
        The development was produced with Anthropic's Claude models in an agentic coding
        harness (Claude Code) under the author's direction. Proof search, refactoring and
        the bulk of tactic writing were model-generated; the choice of what to prove, the
        statements, and all status judgements are the author's, who reviewed and accepted
        every result.
    - method: manual
      tool_setup: >-
        Portions were written or repaired by hand by the author, and the manuscript
        the development follows is the author's own prior work.

review:
  status: agent-reviewed
  reviewers:
    - "Bryan Ehrlich (author)"
    - "Adversarial review by separate language-model sessions (Anthropic Claude, OpenAI Codex)"
  notes: >-
    The development carries a mechanical audit, AxiomAudit.lean, which on elaboration
    enforces over every declaration in the tracked tree: an axiom closure contained in
    Lean's three core axioms, absence of any custom axiom declaration, absence of sorryAx
    and native_decide, a pinned module manifest, and type and body freezes on the statement
    boundary. docs/coverage/STATEMENT-MANIFEST.md records which of the manuscript's numbered results are
    formalized and which are not. Many of the unformalized ones carry a dated, compiling
    certificate in docs/wall-certificates/ that states the missing step in Lean with a sorry at
    the gap rather than estimating it in prose; that coverage is not total, and those files
    are never imported by the library. The campaign record, including retractions and self-corrections, is in
    docs/history/LEDGER.md; the frozen row list is docs/coverage/STATEMENT-MANIFEST.md. Review was iterative and
    adversarial rather than external and independent: no third party has refereed this
    development.

sources:
  - title: >-
      Sequential Products on Euclidean Jordan Algebras: Classification in Rank at
      Least Three and the Complex Qubit
    type: paper
    authors:
      - "Bryan Ehrlich"
    relationship: formalizes
    author_endorsement: participated
    note: >-
      Unpublished manuscript by the author, which these two theorems formalize. It has
      not been peer reviewed. No stable public identifier exists at the time of
      submission, so the source cannot be independently confirmed, and no priority or
      novelty is claimed from it.
  - title: "Sequential product spaces are Jordan algebras"
    type: paper
    authors:
      - "John van de Wetering"
    identifier: "arXiv:1803.11139"
    relationship: background
    note: >-
      Supplies Definition 2, the axioms S1-S7 that SeqProd states, and the
      sequential-product-to-Jordan-algebra framework the classification sits in.
  - title: "Power-associative rings"
    type: paper
    authors:
      - "A. A. Albert"
    identifier: "doi:10.1090/S0002-9947-1948-0027750-7"
    relationship: adapts
    author_endorsement: "n/a"
    note: >-
      Origin of the power-associativity result registered as
      AlbertPowerAssoc.jpow_mul_jpow. The Lean theorem specializes Albert's torsion-free
      power-associativity criterion to commutative Jordan rings; it is not a transcription
      of Albert's statement. Albert works with algebras over a field of characteristic
      zero, whereas the registered statement is about a non-unital commutative Jordan ring
      carrying a real module structure that need not interact with the multiplication and
      is used only for additive torsion-freeness. The Lean proof is independent of
      Albert's argument in its details.
  - title: "Sequential product on standard effect algebra E(H)"
    type: paper
    authors:
      - "Jun Shen"
      - "Junde Wu"
    identifier: "arXiv:0905.0596"
    relationship: background
    note: >-
      Records that Lueders is not the only sequential product on the standard effect
      algebra, answering a question of Gudder (2005), and gives a general method for
      constructing others. Its construction includes a twisted product of the shape
      registered here. The twisted products are therefore not new with this development;
      what is registered here is the converse direction, that S1-S7 together with
      order-unit-norm continuity force that family on H_N(C) for N >= 3 and pin the
      parameter uniquely, and force the Lueders product outright on H_N(R). Shen and Wu
      prove no such classification.
  - title: "Remarks on the Sequential Products"
    type: paper
    authors:
      - "Weihua Liu"
      - "Zhaoqi Wu"
      - "Junde Wu"
    identifier: "arXiv:1009.2593"
    relationship: background
    note: >-
      Shows the sequential products constructed in the two 2009 J. Phys. A papers are
      unitary equivalent to the Lueders product. Relevant to how the twisted family
      should be read, and cited so that the prior status of these examples is on the
      record alongside the classification registered here.
  - title: "Wigner's theorem on symmetries of quantum mechanical systems, real case"
    type: folklore
    relationship: formalizes
    author_endorsement: "n/a"
    note: >-
      Source of WignerReal.exists_isometry_of_transProbPreserving. The classical statement
      is due to Wigner; dropping bijectivity gives what the literature calls the
      non-bijective Wigner theorem, which is NOT the Uhlhorn form (Uhlhorn instead weakens the
      hypothesis to preservation of orthogonality and traditionally retains bijectivity). The
      finite-dimensional real case in the exact form registered here is standard but we give
      no single canonical reference for it. No priority claim is made. We are aware of no
      formalization of the real case in Lean or any other proof assistant, and have not
      carried out a systematic search; the complex case here is vendored from a separate
      Lean development.
  - title: "Sequential products on effect algebras"
    type: paper
    authors:
      - "Stanley Gudder"
      - "Richard Greechie"
    relationship: background
    note: >-
      Origin of the sequential product notion and of the Lueders product as its
      motivating example on operator effects.

related_formalizations:
  - id: "leanprover-community/physlib"
    relationship: builds-on
    note: >-
      Seventeen modules (Hermitian matrices with the Loewner order, trace inner
      product, continuous functional calculus, Jordan product) by Alex Meiburg, with
      HermitianMat/Proj.lean also by Leonardo A Lessa, vendored at commit a50684a191
      under RadicalRelativity/Vendor/ with per-file copyright headers retained. They
      form the carrier substrate the classification is proved over. The modules match
      that upstream pin except for two documented edits, an import-path rewrite and one
      restored set_option; five lemmas upstream states only over the complex numbers are
      restated at RCLike generality in first-party code rather than patched in place. The
      edit log and a zero-statement-change audit are in RadicalRelativity/Vendor/VENDOR.md.
  - id: "zblore/csd-lean4"
    relationship: builds-on
    note: >-
      Eight modules by Zayn Blore giving complex Wigner rigidity on CP^(N-1), vendored
      at commit 818b770010ae; this is an input to the complex case. The
      corresponding real, non-bijective Wigner theorem is first-party
      (RadicalRelativity/Wigner/RealWigner.lean) and is not derived from this work.
